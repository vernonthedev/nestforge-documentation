<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">NestForge Module Graph</title>
  <desc id="desc">Illustrated screenshot of the NestForge VS Code module graph feature.</desc>
